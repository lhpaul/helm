rules:
  - id: "zod-strict-validation-for-api-inputs"
    name: "Use strict Zod schemas for API inputs"
    type: llm
    severity: warning
    category: "style"
    message: "Validate route params and request bodies with Zod `.strict()` schemas (including refinements for business constraints) instead of ad-hoc manual checks."
    llm:
      prompt: "Validate route params and request bodies with Zod `.strict()` schemas (including refinements for business constraints) instead of ad-hoc manual checks."
  - id: "sanitize-and-map-http-errors"
    name: "Sanitize client errors and map HTTP status codes"
    type: llm
    severity: warning
    category: "security"
    message: "Map known/domain failures to explicit non-2xx HTTP status codes and return generic client-safe error bodies while logging internal details server-side."
    llm:
      prompt: "Map known/domain failures to explicit non-2xx HTTP status codes and return generic client-safe error bodies while logging internal details server-side."
  - id: "block-dot-segment-path-inputs"
    name: "Reject dot-segment identifiers before path use"
    type: llm
    severity: warning
    category: "security"
    message: "Reject `.` and `..` style dot-segment identifier values before constructing filesystem paths, even if broader identifier regexes allow dots."
    llm:
      prompt: "Reject `.` and `..` style dot-segment identifier values before constructing filesystem paths, even if broader identifier regexes allow dots."
  - id: "atomic-create-for-persisted-records"
    name: "Use atomic create-if-absent writes"
    type: llm
    severity: warning
    category: "performance"
    message: "For create operations on persisted state, use atomic exclusive-write primitives (for example `writeFile` with `flag: 'wx'`) instead of check-then-create flows."
    llm:
      prompt: "For create operations on persisted state, use atomic exclusive-write primitives (for example `writeFile` with `flag: 'wx'`) instead of check-then-create flows."
  - id: "no-mutable-internal-state-in-responses"
    name: "Return defensive copies from APIs"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not return mutable internal objects or arrays directly from storage/cache/handlers; return copied values instead."
    llm:
      prompt: "Do not return mutable internal objects or arrays directly from storage/cache/handlers; return copied values instead."
  - id: "never-throw-at-parser-boundaries"
    name: "Keep parser/webhook boundaries non-throwing"
    type: llm
    severity: warning
    category: "patterns"
    message: "Boundary parser and signature-verification functions must catch internal exceptions and return a typed error/fallback path instead of throwing."
    llm:
      prompt: "Boundary parser and signature-verification functions must catch internal exceptions and return a typed error/fallback path instead of throwing."
  - id: "resolve-async-session-results-on-failure"
    name: "Always resolve async session/job outcomes"
    type: llm
    severity: warning
    category: "patterns"
    message: "Async runtime/session execution paths must catch failures and resolve final waitable results consistently so `wait()` callers never hang on error paths."
    llm:
      prompt: "Async runtime/session execution paths must catch failures and resolve final waitable results consistently so `wait()` callers never hang on error paths."
  - id: "avoid-timing-dependent-concurrency-tests"
    name: "Make async concurrency tests deterministic"
    type: llm
    severity: warning
    category: "style"
    message: "In concurrency/async tests, control completion ordering explicitly (for example with deferred promises) rather than relying on timing-sensitive assertions."
    llm:
      prompt: "In concurrency/async tests, control completion ordering explicitly (for example with deferred promises) rather than relying on timing-sensitive assertions."
