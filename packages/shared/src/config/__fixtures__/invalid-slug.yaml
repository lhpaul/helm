helm_version: '0'
product:
  slug: 'My App'
  name: 'My App'

issue_tracker:
  provider: github_projects
  org: test-org
  project_number: 1

code_repos:
  - url: https://github.com/test-org/test-app
    default_branch: main
    role: app

knowledge_repo:
  url: https://github.com/test-org/test-knowledge
  default_branch: main

workflow:
  stages_enabled:
    - in-development
    - code-review
    - released
  designer_gate: skip
  qa_gate: skip

specialists:
  spec-writer:
    runtime: claude_code
    model: claude-sonnet-4-6
  plan-writer:
    runtime: claude_code
    model: claude-sonnet-4-6
  implementer:
    runtime: claude_code
    model: claude-opus-4-7
  code-reviewer:
    runtime: claude_code
    model: claude-sonnet-4-6
  security-reviewer:
    runtime: claude_code
    model: claude-sonnet-4-6
  test-reviewer:
    runtime: claude_code
    model: claude-sonnet-4-6
  remediation:
    runtime: claude_code
    model: claude-sonnet-4-6
