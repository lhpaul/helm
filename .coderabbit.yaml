reviews:
  profile: assertive # opciones: assertive | chill — chill comenta menos
  request_changes_workflow: false # no bloquees el merge automático
  high_level_summary: true
  poem: false # apaga el "poema" cómico al final de cada review
  review_status: true
  auto_review:
    # Apagado: el dogfood de Helm usa Codex GitHub como external reviewer
    # (review.external.provider: codex-github en helm-knowledge/.helm/product.yaml).
    # CodeRabbit venía rate-limiteando cada review en los PRs abiertos, así que
    # dejó de aportar señal. La config queda para poder volver invirtiendo este
    # flag; un `@coderabbitai review` manual sigue funcionando.
    enabled: false
    drafts: false # no revise PRs en draft
