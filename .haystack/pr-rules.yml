rules:
  - id: "atomic-file-create-wx"
    name: "Use exclusive create for new files"
    type: llm
    severity: warning
    category: "security"
    message: "Create new files with an exclusive write flag and handle already-exists errors instead of check-then-write logic."
    llm:
      prompt: "Create new files with an exclusive write flag and handle already-exists errors instead of check-then-write logic."
  - id: "avoid-toctou-uniqueness-checks"
    name: "Use atomic uniqueness operations"
    type: llm
    severity: warning
    category: "patterns"
    message: "Enforce one-running-job or one-time-create rules with a single atomic store operation, not a separate exists check."
    llm:
      prompt: "Enforce one-running-job or one-time-create rules with a single atomic store operation, not a separate exists check."
  - id: "return-defensive-copies"
    name: "Return copies of internal state"
    type: llm
    severity: warning
    category: "style"
    message: "Return a copy of arrays or objects from services and stores instead of returning mutable internal state directly."
    llm:
      prompt: "Return a copy of arrays or objects from services and stores instead of returning mutable internal state directly."
  - id: "scope-enoent-fallback-to-target-file"
    name: "Limit ENOENT fallback to the expected file"
    type: llm
    severity: warning
    category: "patterns"
    message: "Only use ENOENT fallback when the missing path is the exact expected file, and rethrow other ENOENT cases."
    llm:
      prompt: "Only use ENOENT fallback when the missing path is the exact expected file, and rethrow other ENOENT cases."
  - id: "strict-zod-validation-for-route-inputs"
    name: "Validate route input with strict Zod schemas"
    type: llm
    severity: warning
    category: "security"
    message: "Validate external request params and bodies with strict Zod schemas and return 400 on validation failure."
    llm:
      prompt: "Validate external request params and bodies with strict Zod schemas and return 400 on validation failure."
  - id: "block-dot-segments-in-fs-inputs"
    name: "Reject dot segments in filesystem inputs"
    type: llm
    severity: warning
    category: "security"
    message: "Reject path inputs containing dot segments and verify resolved paths stay inside the allowed base directory."
    llm:
      prompt: "Reject path inputs containing dot segments and verify resolved paths stay inside the allowed base directory."
  - id: "sanitize-client-error-messages"
    name: "Keep client errors generic"
    type: llm
    severity: warning
    category: "security"
    message: "Return generic error messages to clients on failures and log detailed errors on the server side."
    llm:
      prompt: "Return generic error messages to clients on failures and log detailed errors on the server side."
  - id: "set-timeouts-on-external-http"
    name: "Set timeout on external HTTP calls"
    type: llm
    severity: warning
    category: "performance"
    message: "Use AbortController timeouts for outbound HTTP requests so external calls cannot hang indefinitely."
    llm:
      prompt: "Use AbortController timeouts for outbound HTTP requests so external calls cannot hang indefinitely."
  - id: "always-resolve-async-terminal-state"
    name: "Always resolve async waiters on failure"
    type: llm
    severity: warning
    category: "patterns"
    message: "Ensure runtime and session code resolves terminal waiters even when errors are thrown."
    llm:
      prompt: "Ensure runtime and session code resolves terminal waiters even when errors are thrown."
  - id: "restore-spies-and-timers-in-finally"
    name: "Restore test globals in finally"
    type: llm
    severity: warning
    category: "style"
    message: "Wrap fake timers and spies with try and finally so cleanup always runs."
    llm:
      prompt: "Wrap fake timers and spies with try and finally so cleanup always runs."
  - id: "use-remediation-artifact-helper"
    name: "Use remediation artifact helper"
    type: llm
    severity: warning
    category: "patterns"
    message: "In remediator flows, write remediation output through the remediation artifact helper instead of direct file writes."
    llm:
      prompt: "In remediator flows, write remediation output through the remediation artifact helper instead of direct file writes."
  - id: "reject-malformed-json-explicitly"
    name: "Return 400 for malformed JSON"
    type: llm
    severity: warning
    category: "security"
    message: "Do not swallow JSON parse failures into empty objects, parse safely and return an explicit 400 invalid JSON response."
    llm:
      prompt: "Do not swallow JSON parse failures into empty objects, parse safely and return an explicit 400 invalid JSON response."
  - id: "use-central-http-error-mapping"
    name: "Use shared HTTP error helpers"
    type: llm
    severity: warning
    category: "style"
    message: "Use shared path validation and error-to-response helpers in routes instead of ad hoc per-route try and catch mapping."
    llm:
      prompt: "Use shared path validation and error-to-response helpers in routes instead of ad hoc per-route try and catch mapping."
  - id: "never-log-raw-agent-content"
    name: "Do not log raw agent output"
    type: llm
    severity: warning
    category: "security"
    message: "Log metadata about agent output and prompts, not raw content that may include sensitive text."
    llm:
      prompt: "Log metadata about agent output and prompts, not raw content that may include sensitive text."
  - id: "fetch-null-only-on-404"
    name: "Return null only on 404 fetches"
    type: llm
    severity: warning
    category: "security"
    message: "Remote fetch helpers may return null for not found but must throw for auth and server failures."
    llm:
      prompt: "Remote fetch helpers may return null for not found but must throw for auth and server failures."
  - id: "use-shared-git-auth-helpers"
    name: "Use shared git auth and redaction helpers"
    type: llm
    severity: warning
    category: "security"
    message: "Use the project git auth helpers for authenticated URLs and token redaction instead of custom env-based git auth logic."
    llm:
      prompt: "Use the project git auth helpers for authenticated URLs and token redaction instead of custom env-based git auth logic."
  - id: "reject-ssh-knowledge-repo-urls"
    name: "Reject SSH knowledge repo URLs"
    type: llm
    severity: warning
    category: "security"
    message: "Reject SSH repository URLs for knowledge-repo operations and require HTTPS URLs."
    llm:
      prompt: "Reject SSH repository URLs for knowledge-repo operations and require HTTPS URLs."
  - id: "enforce-workspace-provisioning-pattern"
    name: "Use role-specific workspace setup"
    type: llm
    severity: warning
    category: "patterns"
    message: "Provision implementer and reviewer workspaces with the project role-specific helpers so each role starts from the correct branch."
    llm:
      prompt: "Provision implementer and reviewer workspaces with the project role-specific helpers so each role starts from the correct branch."
  - id: "preserve-runtime-spawn-defaults"
    name: "Keep runtime spawn safety defaults"
    type: llm
    severity: warning
    category: "patterns"
    message: "When updating runtime spawn code, keep stdin ignored and stdout and stderr piped unless a documented helper changes it."
    llm:
      prompt: "When updating runtime spawn code, keep stdin ignored and stdout and stderr piped unless a documented helper changes it."
  - id: "validate-runtime-config-invariants"
    name: "Validate runtime config cross-field rules"
    type: llm
    severity: warning
    category: "patterns"
    message: "Enforce runtime selection invariants in schema validation so mixed specialist runtime settings are rejected."
    llm:
      prompt: "Enforce runtime selection invariants in schema validation so mixed specialist runtime settings are rejected."
  - id: "update-colocated-tests-with-logic-changes"
    name: "Update paired tests with logic changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "When changing route, dispatcher, or storage logic, update the colocated test file in the same pull request."
    llm:
      prompt: "When changing route, dispatcher, or storage logic, update the colocated test file in the same pull request."
